name: Anomaly (ANM)
description: Report a No Pass from the L440 verification matrix
title: "[ANM-XXX] "
projects: ["VIRTEST-TECHNOLOGIES/13"]
body:
  - type: markdown
    attributes:
      value: |
        Use one issue per defect. Replace ANM-XXX in the title with the ID from the Anomalies sheet.
        Never include identifiable patient data.
  - type: input
    id: tests
    attributes:
      label: Test ID(s)
      placeholder: TST-MED-004, TST-MED-005
    validations:
      required: true
  - type: input
    id: build
    attributes:
      label: SW version / build and environment
      placeholder: v1.4.0-rc2 · PRE · Chrome 130 · Windows 11
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps followed
      placeholder: |
        1. Open the Measurements panel.
        2. Edit the ostium contour.
    validations:
      required: true
  - type: textarea
    id: observed
    attributes:
      label: Observed vs expected result
      placeholder: |
        Observed: the diameter keeps the previous value.
        Expected: the diameter is recalculated.
    validations:
      required: true
  - type: dropdown
    id: severity
    attributes:
      label: Proposed severity
      description: "Critical: wrong clinical decision, patient mix-up, data loss or security breach. Major: function not as specified, workaround exists. Minor: cosmetic or text."
      options:
        - Critical
        - Major
        - Minor
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: File name(s) in /Evidence/<version>/<module>/ and/or drag the screenshot here.
    validations:
      required: true
