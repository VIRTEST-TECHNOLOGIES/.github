name: 📖 User story
description: A deliverable slice of value within an Epic. Should fit in one sprint.
title: "[Story] "
labels: ["type: story", "status: needs-triage"]
type: Story
body:
  - type: input
    id: epic
    attributes:
      label: Parent epic
      description: Reference to the epic, usually in the coordination repository. Also link it as a sub-issue.
      placeholder: "my-org/product#12"
    validations:
      required: true

  - type: textarea
    id: story
    attributes:
      label: Story
      value: |
        **As a** [type of user]
        **I want** [action]
        **so that** [benefit]
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Given / When / Then format. Each one must be verifiable in QA.
      value: |
        - [ ] **Given** … **when** … **then** …
        - [ ] **Given** … **when** … **then** …
    validations:
      required: true

  - type: dropdown
    id: size
    attributes:
      label: Estimated size
      options:
        - "XS – hours"
        - "S – 1 day"
        - "M – 2-3 days"
        - "L – 1 week"
        - "XL – split before starting"
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Area
      multiple: true
      options:
        - Frontend
        - Backend
        - Mobile
        - Infra / DevOps
        - Design
        - Data / Analytics

  - type: textarea
    id: design
    attributes:
      label: Design & notes
      description: Mockups, flows, edge cases, UI copy.

  - type: checkboxes
    id: dor
    attributes:
      label: Definition of Ready
      description: Check before moving to "Ready".
      options:
        - label: Clear, verifiable acceptance criteria
        - label: Design available (if applicable)
        - label: Dependencies identified and not blocking
        - label: Estimated, size ≤ L
