name: 🎯 Epic / Feature
description: A complete feature for the release. Groups user stories and tasks.
title: "[Epic] "
labels: ["type: epic", "status: needs-triage"]
type: Epic
body:
  - type: markdown
    attributes:
      value: |
        An **Epic** is a feature of the release, broken down into stories (sub-issues).
        Only the first three fields are required — fill in the rest when it helps.

  - type: textarea
    id: problem
    attributes:
      label: Problem / goal
      description: What the user needs and why. One or two sentences is enough.
      placeholder: "Users have to re-enter their measurements every time they open the app."
    validations:
      required: true

  - type: textarea
    id: scope_in
    attributes:
      label: In scope
      description: What must exist for this feature to be done in this release.
      placeholder: |
        - Save measurements
        - Load saved measurements when opening the app
    validations:
      required: true

  - type: dropdown
    id: priority
    attributes:
      label: Priority
      options:
        - "P0 – Blocks the release"
        - "P1 – Important for the release"
        - "P2 – Nice to have"
    validations:
      required: true

  - type: textarea
    id: scope_out
    attributes:
      label: Out of scope
      description: What is explicitly NOT part of this release.
      placeholder: |
        - Measurement history / charts → next release

  - type: textarea
    id: stories
    attributes:
      label: Stories
      description: Initial list. Create them as sub-issues in the repository where the code changes.
      placeholder: |
        - [ ] As a user I want to save my measurements…
        - [ ] As a user I want to see my saved measurements…

  - type: textarea
    id: success
    attributes:
      label: How we'll know it works
      placeholder: "- 80% of active users have saved measurements after 2 weeks"

  - type: textarea
    id: notes
    attributes:
      label: Design, links, risks
      placeholder: |
        - Figma: https://
        - Depends on …
